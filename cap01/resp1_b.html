<!--
  b) Elaborar um programa para uma pizzaria, o qual leia o valor total de uma conta e quantos clientes vão pagá-la. Calcule e informe o valor a ser pago por cliente. 
  
  Exemplo: 
  Valor da Conta R$: 90.00 
  Número de Clientes: 3 
  Valor por cliente R$: 30.00
-->

<meta charset="utf-8">

<script>
  const valorConta = Number(prompt("Valor da Conta R$:"))
  const numeroClientes = Number(prompt("Número de Clientes:"))
  const valorPorCliente = valorConta / numeroClientes
  alert(`Valor por cliente R$: ${valorPorCliente.toFixed(2)}`)
</script>

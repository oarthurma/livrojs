<!--
  c) Elaborar um programa para uma loja, o qual leia o preço de um produto e informe as opções de pagamento da loja. Calcule e informe o valor para pagamento à vista com 10% de desconto e o valor em 3x. 
  
  Exemplo: 
  Preço R$: 60.00 
  À Vista R$: 54.00 
  Ou 3x de R$: 20.00
-->

<meta charset="utf-8">

<script>
const preco = Number(prompt("Preço R$:"))
const aVista = preco - (preco * 0.10)
const prazo3vezes = preco / 3
alert(`À Vista R$: ${aVista.toFixed(2)}\nOu 3x de R$: ${prazo3vezes.toFixed(2)}`)
</script>

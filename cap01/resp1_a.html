<!--
  a) Elaborar um programa que leia um número. Calcule e informe os seus vizinhos, ou seja, o número anterior e posterior.

  Exemplo: 
  Número: 15 
  Vizinhos: 14 e 16
-->

<meta charset="utf-8">

<script>
// Entrada de dados:
const numero = Number(prompt("Número: "));

// Processamento:
const vizinhoMenor = numero - 1;
const vizinhoMaior = numero + 1;

// Saída de dados:
alert(`Vizinhos: ${vizinhoMenor} e ${vizinhoMaior}`)

</script>

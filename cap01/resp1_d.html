<!--
  d) Elaborar um programa que leia 2 notas de um aluno em uma disciplina. Calcule e informe a média das notas. 
  
  Exemplo: 
  1ª Nota: 7.0 
  2ª Nota: 8.0 
  Média: 7.5
-->

<meta charset="utf-8">

<script>
const nota1 = Number(prompt("1ª Nota:"))
const nota2 = Number(prompt("2ª Nota:"))
const media = (nota1 + nota2) / 2
alert(`Média: ${media.toFixed(1)}`)
</script>
